# The URL the site will be built for
base_url = "https://a5huynh.github.io"
title = "Andrew Huynh, The Blog"
# Used for the default meta description and og:description on non-post pages.
description = "Thoughts and ramblings."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# No search UI exists, and the generated index (elasticlunr.min.js +
# search_index.en.js, ~870KB) was referenced by zero pages. Flip back on if a
# search box is ever added.
build_search_index = false

# Atom feed at /atom.xml
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
    {name = "tags"}
]

[extra]
favicon = "/favicon/favicon.ico"

[markdown]
render_emoji = true

# Preserve pre-0.19 link rendering: don't add rel="external" to outbound links.
external_links_external = false

[markdown.highlighting]
# Theme can be any theme supported by Zola
theme = "monokai"
